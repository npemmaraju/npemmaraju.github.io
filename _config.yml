about_profile_image: images/profile.jpg
about_content: |
  Hi! I'm Narayani, a first-year MS Data Science student at NYU specializing in the Biomedical Track. I previously studied Mechanical Engineering at IIT Kharagpur — and yes, I find it *hilarious* that the path from thermodynamics to transformers made such perfect sense in hindsight. I've worked on projects spanning fraud detection, NLP for social media analysis, and healthcare ML applications.

  I'm passionate about applying machine learning to solve real-world problems, particularly in healthcare and finance. When I'm not coding or diving into data, you'll find me exploring New York City on long walks or enjoying music (I play the ukulele!).

  **Current Focus:** Quantitative finance, computer vision for emergency detection systems, and genomics research analyzing ribosomal RNA variants.

