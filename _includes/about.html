<div class="container intro-container sketch-fade">
  <h3 id="{{ site.about_title | slugify | default: 'about-me' }}">{{ site.about_title | default: "About Me" }}</h3>
  <div class="row clearfix">
    {%- if site.about_profile_image -%}
      <div class="col-xs-12 col-sm-4 col-md-3 no-print" style="position:relative;">
        <span class="profile-img" style="background-image: url({{ site.about_profile_image | relative_url }})"></span>
        <!-- Small SVG arrow pointing toward the bio text — doodle style -->
        <svg class="about-arrow no-print" aria-hidden="true"
             style="position:absolute; bottom:-10px; right:-16px; width:60px; height:50px; overflow:visible; opacity:0.55;"
             viewBox="0 0 60 50">
          <path d="M5 40 C10 20, 30 10, 52 8" stroke="currentColor" stroke-width="2" fill="none"
                stroke-linecap="round" stroke-dasharray="1,0"/>
          <!-- Arrowhead -->
          <path d="M48 4 L54 10 L45 12" stroke="currentColor" stroke-width="2" fill="none"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    {%- endif -%}
    <div class="{{ 'col-xs-12 ' }}{%- if site.about_profile_image -%}col-sm-8 col-md-9 col-print-12{%- endif -%}">
      {{ site.about_content | strip | markdownify }}
    </div>
  </div>
</div>
