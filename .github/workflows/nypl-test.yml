name: NYPL scraper test
on:
  push:
    branches: [claude/kind-dirac-rcw4b0]
    paths: ['scripts/nypl/**', '.github/workflows/nypl-test.yml']
  workflow_dispatch:
    inputs:
      query:
        description: "Search keywords"
        default: "verity colleen hoover"
        required: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/nypl/requirements.txt
      - name: Check reachability
        run: curl -sS -o /dev/null -w "bibliocommons HTTP %{http_code}\n" "https://nypl.bibliocommons.com/" || true
      - name: Run scraper
        run: python3 scripts/nypl/nypl_verity.py "${{ inputs.query || 'verity colleen hoover' }}"
